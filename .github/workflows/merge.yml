name: Merge Jild 28 tashreeh
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge chunks
        run: python3 merge_jild28.py
      - name: Verify merged file
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('jild-28.json', encoding='utf-8'))
          items = d['masail']
          pages = set()
          for it in items:
              pages.update(it['pages'])
          print('items:', len(items))
          print('unique pages:', len(pages), 'min:', min(pages), 'max:', max(pages))
          print('ids unique:', len(set(it['id'] for it in items)) == len(items))
          print('empty jawab:', [it['id'] for it in items if not it.get('tashreeh_jawab')])
          print('empty sawal count:', sum(1 for it in items if not it.get('tashreeh_sawal')))
          print('volume_ids:', sorted(set(it.get('volume_id') for it in items)))
          print('start_page==min(pages) all:', all(it.get('start_page') == min(it['pages']) for it in items))
          print('sorted by start_page:', [it['start_page'] for it in items] == sorted(it['start_page'] for it in items))
          combined = {
              'jild28-shamama-4-nufha-3': (list(range(206, 216)), 0, 7850),
              'jild28-shamama-4-nufha-14': (list(range(254, 262)), 0, 7435),
              'jild28-shamama-4-nufha-21': (list(range(303, 335)), 0, 30108),
              'jild28-zulal-shubha-1-muqaddimat': (list(range(531, 551)), 0, 19057),
              'jild28-zalal-nqi-radd-abu-ubayda': ([p for p in range(579, 604) if p != 594], 0, 23422),
          }
          for cid, (expected_pages, exp_sawal, exp_jawab) in combined.items():
              hits = [it for it in items if it['id'] == cid]
              print(cid, 'items:', len(hits), 'pages:', hits[0]['pages'][0], '-', hits[0]['pages'][-1], f'({len(hits[0]["pages"])} pages)' if hits else None)
              assert len(hits) == 1
              assert hits[0]['pages'] == expected_pages, f'{cid}: pages mismatch'
              assert len(hits[0].get('tashreeh_sawal', '')) == exp_sawal, f'{cid}: sawal length mismatch'
              assert len(hits[0].get('tashreeh_jawab', '')) == exp_jawab, f'{cid}: jawab length mismatch'
              assert hits[0].get('tashreeh_jawab'), f'{cid}: jawab empty'
              if exp_sawal:
                  assert hits[0].get('tashreeh_sawal'), f'{cid}: sawal empty'
          # the five absorbed ids must be gone (chunk 05's nafha-3 is
          # checked start_page-scoped: chunk 03's nafha-3 keeps the id)
          for sid in ['jild28-nafha-14',
                      'jild28-nafha-21',
                      'jild28-risala-535',
                      'jild28-zalal-nqi-1',
                      'jild28-risala-77-shubha-1']:
              assert not any(it['id'] == sid for it in items), f'absorbed id {sid} must not exist'
          assert not any(it['id'] == 'jild28-nafha-3' and it['start_page'] == 213 for it in items), "chunk 05's nafha-3 must not exist"
          print('absorbed ids gone (5 + chunk-05 nafha-3)')
          # the 16 rename-only targets must exist with exact pages
          for did, exp_pages in [
                  ('jild28-shamama-4-nufha-4', [215, 216, 217, 218]),
                  ('jild28-shamama-4-nufha-5', [218, 219]),
                  ('jild28-shamama-4-nufha-6', [219, 220, 221, 222, 223, 224, 225]),
                  ('jild28-shamama-4-nufha-7', [225, 226, 227, 228, 229]),
                  ('jild28-shamama-4-nufha-8', [229, 230, 231, 232]),
                  ('jild28-shamama-4-nufha-9', [232, 233, 234, 235, 236, 237, 238]),
                  ('jild28-shamama-4-nufha-10', [238, 239, 240, 241, 242, 243, 244, 245, 246, 247]),
                  ('jild28-shamama-4-nufha-11', [247, 248, 249]),
                  ('jild28-shamama-4-nufha-12', [249, 250, 251]),
                  ('jild28-shamama-4-nufha-13', [251, 252, 253, 254]),
                  ('jild28-shamama-4-nufha-15', [261, 262, 263, 264, 265, 266]),
                  ('jild28-shamama-4-nufha-16', [266, 267, 268, 269, 270, 271]),
                  ('jild28-shamama-4-nufha-17', [271, 272, 273]),
                  ('jild28-shamama-4-nufha-18', [274, 275, 276, 277, 278, 279, 280, 281, 282, 283, 284, 285, 286]),
                  ('jild28-shamama-4-nufha-19', [286, 287, 288, 289]),
                  ('jild28-shamama-4-nufha-20', list(range(289, 304)))]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (rename-only target)')
          # chunk 03's plain nafha-1..10 (lesson 533) keep their ids
          for did, exp_pages in [
                  ('jild28-nafha-1', [113, 114, 115, 116, 117]),
                  ('jild28-nafha-2', [117, 118, 119, 120]),
                  ('jild28-nafha-3', [120, 121, 122]),
                  ('jild28-nafha-4', [122, 123, 124]),
                  ('jild28-nafha-5', [124, 125]),
                  ('jild28-nafha-6', [125, 126, 127, 128, 129, 130, 131, 132]),
                  ('jild28-nafha-7', [132, 133, 134]),
                  ('jild28-nafha-8', [134, 135, 136]),
                  ('jild28-nafha-9', [136, 137, 138, 139, 140, 141, 142, 143, 144, 145, 146, 147, 148, 149]),
                  ('jild28-nafha-10', [149, 150, 151, 152, 153, 154, 155])]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (chunk 03 plain id kept)')
          # chunk 02's nafhah-1..12 (with 'h') stay untouched
          for did, exp_pages in [
                  ('jild28-nafhah-1', list(range(65, 78))),
                  ('jild28-nafhah-2', [77, 78, 79]),
                  ('jild28-nafhah-3', list(range(79, 89))),
                  ('jild28-nafhah-4', list(range(89, 94))),
                  ('jild28-nafhah-5', [93, 94, 95]),
                  ('jild28-nafhah-6', [95, 96]),
                  ('jild28-nafhah-7', [96, 97]),
                  ('jild28-nafhah-8', [97, 98, 99]),
                  ('jild28-nafhah-9', list(range(99, 105))),
                  ('jild28-nafhah-10', [104, 105]),
                  ('jild28-nafhah-11', [105, 106, 107]),
                  ('jild28-nafhah-12', list(range(107, 113)))]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (nafhah spelling untouched)')
          # items that must stay separate
          for did, exp_pages in [
                  ('jild28-risala-535-tatimma', [p for p in range(336, 361) if p != 355]),
                  ('jild28-zulal-tadhyeel', list(range(641, 652))),
                  ('jild28-masala-8', [428, 429, 430, 431]),
                  ('jild28-masala-11', list(range(368, 404))),
                  ('jild28-masala-22', list(range(469, 479))),
                  ('jild28-masala-22-doom', list(range(478, 490))),
                  ('jild28-pesh-lafz', [5, 6, 7, 8, 9, 10]),
                  ('jild28-zulal-latifa-baqillani', [683, 684, 685, 686])]:
              hits = [it for it in items if it['id'] == did]
              assert len(hits) == 1, f'{did}: expected exactly 1 item'
              assert hits[0]['pages'] == exp_pages, f'{did}: pages mismatch'
              print(did, 'present (kept separate)')
          assert len(items) == 89
          assert len(pages) == 636
          assert min(pages) == 5 and max(pages) == 686
          assert len(set(it['id'] for it in items)) == len(items)
          # exactly ZERO empty jawabs after the merge
          assert {it['id'] for it in items if not it.get('tashreeh_jawab')} == set()
          # exactly 72 empty sawal (all by design)
          assert len({it['id'] for it in items if not it.get('tashreeh_sawal')}) == 72
          print('VERIFICATION PASSED')
          EOF
      - name: Create release with merged file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la jild-28.json
          gh release create v1.0 jild-28.json --title "Jild 28 tashreeh - merged" --notes "Merged tashreeh for Fatawa Razviya Jild 28: 89 items, 636 pages (volume_id 32, pp. 5-686, 46 source-DB gap pages 11-50/335/355/364/490/492/594; source export has 637 rows / 636 unique pages — p. 554 has two rows). Generated by merge_jild28.py from the 14 chunk files; 5 combine cases (shamama-4-nufha-3, shamama-4-nufha-14, shamama-4-nufha-21, zulal-shubha-1-muqaddimat, zalal-nqi-radd-abu-ubayda); 16 rename-onlys (chunk 05/06 nafha ids -> shamama-4-nufha-N form; chunk 03 keeps plain nafha-1..10; nafhah spelling untouched); no applied-in-chunk renames; tatimma and tadhyeel kept separate; masala-8 plain id kept; zero empty jawab after merge." || gh release upload v1.0 jild-28.json --clobber
